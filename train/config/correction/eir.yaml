# Run: python imitate_correction.py --data processed_data/eir_correction --output weights/eir_correction
policy:
  robot_mode: dual_robot
  control_mode: acceleration_correction
  chunk_size: 2
  n_action_steps: 1
  n_obs_steps: 1
  temporal_ensemble_momentum: null
  state_token_keys:
    - observation.answer_q
    - observation.answer_v
    - observation.nominal_on_answer
  input_shapes:
    observation.answer_q: [14]
    observation.answer_v: [14]
    observation.nominal_on_answer: [14]
  output_shapes:
    action.correction: [14]
  # preprocess_correction.py has already normalized BOTH inputs and labels.
  input_normalization_modes: {}
  output_normalization_modes: {}
  use_vae: false
  dim_model: 128
  n_heads: 4
  dim_feedforward: 512
  n_encoder_layers: 2
  n_decoder_layers: 1
  dropout: 0.1
train:
  epochs: 20000
  batch_size: 256
  lr: 0.0001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  num_workers: 0
  seed: 0
  wandb:
    enabled: false  # Set true, or pass --wandb to the trainer/Bash script.
    project: eir-teleop-modeling
    entity: null  # null uses your W&B default account/team.
    name: null  # null uses the checkpoint directory name.
    mode: online  # offline saves logs locally without uploading.
