# One nominal PD step, then a learned position residual and backward differences.
policy:
  robot_mode: dual_robot
  control_mode: position_correction
  chunk_size: 2
  n_action_steps: 1
  n_obs_steps: 1
  temporal_ensemble_momentum: null
  state_token_keys:
    - observation.answer_q
    - observation.answer_v
    - observation.teleop_error
  input_shapes:
    observation.answer_q: [14]
    observation.answer_v: [14]
    observation.teleop_error: [14]
  output_shapes:
    action.position_correction: [14]
  input_normalization_modes: {}
  output_normalization_modes: {}
  use_vae: false
  dim_model: 128
  n_heads: 4
  dim_feedforward: 512
  n_encoder_layers: 2
  n_decoder_layers: 1
  dropout: 0.1
train:
  epochs: 20000
  batch_size: 256
  lr: 0.0001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  num_workers: 0
  seed: 0
  wandb:
    enabled: false
    project: eir-teleop-modeling
    entity: null
    name: null
    mode: online
