# Independent q/v residuals on one nominal PD step; both corrected states feed back.
policy:
  chunk_size: 2
  control_mode: position_velocity_correction
  dim_feedforward: 512
  dim_model: 128
  dropout: 0.1
  input_normalization_modes: {}
  input_shapes:
    observation.reference_q:
    - 14
    observation.reference_v:
    - 14
    observation.reference_teleop_error:
    - 14
  n_action_steps: 1
  n_decoder_layers: 1
  n_encoder_layers: 2
  n_heads: 4
  n_obs_steps: 1
  output_normalization_modes: {}
  output_shapes:
    action.delta_q:
    - 14
    action.delta_v:
    - 14
  robot_mode: dual_robot
  state_token_keys:
  - observation.reference_q
  - observation.reference_v
  - observation.reference_teleop_error
  temporal_ensemble_momentum: null
  use_vae: false
train:
  batch_size: 256
  epochs: 20000
  grad_clip_norm: 1.0
  lr: 0.0001
  num_workers: 0
  seed: 0
  wandb:
    enabled: false
    entity: null
    mode: online
    name: null
    project: eir-teleop-modeling
  weight_decay: 0.0001
